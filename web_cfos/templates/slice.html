            $(document).ready(function() {
                let obj_urls = get_filenames({{ obj_urls | tojson }});
                let raw_urls = get_filenames({{ raw_urls | tojson }});
                let ann_urls = get_filenames({{ ann_urls | tojson }});

            function get_filenames(obj_urls_temp) {
                let obj_urls = JSON.parse(obj_urls_temp)
                let obj_urls_new = []

                for(let i=0; i < obj_urls.length; i++){
                    let obj_url = obj_urls[i];
                    obj_urls_new.push(obj_url.replace('%5C','/') )
                }    
                return obj_urls_new;

            }

            async  function init(file_names ,file_names_raw, file_names_ann) {

                
                


                let func_arr = []
                for ( let i = 0; i < 10; i ++ ) {
                    let _file = file_names[i].split("/");
                    let data_id = _file[_file.length-1].split(".")[0];
                    const content = document.getElementById( 'content' );
                    // make a list item
                    const element = document.createElement( 'div' );
                    element.className = 'list-item';

                    content.appendChild( element );



                    const descriptionElement = document.createElement( 'div' );
                    descriptionElement.className = 'item';
                    descriptionElement.innerText = data_id;
                    element.appendChild( descriptionElement );


                    const scene = new THREE.Scene();

                    scenes.push( scene );


                    const axesHelper = new THREE.AxesHelper(2)
                    scene.add(axesHelper)
                    
                    
                    //renderer = new THREE.WebGLRenderer( { antialias: true } );

                    const renderer = new THREE.WebGLRenderer( {  antialias: true } );
                    renderer.setClearColor( 0x000000, 1 );
                    renderer.setPixelRatio( window.devicePixelRatio );
                    //renderer.setSize( window.innerWidth, window.innerHeight );
                    renderer.setSize( 800,500);       
                    
                    //renderer.setViewport(0,0,1,1);
                    //renderer.setAnimationLoop( animate );

                    const sceneElement = document.createElement( 'div' );
                    sceneElement.className = 'item';
                    sceneElement.appendChild( renderer.domElement );


                    element.appendChild(sceneElement );
                    

                    const sceneElement2 = document.createElement( 'div' );
                    sceneElement2.className = 'item';
                    element.appendChild( sceneElement2 );

                    const imgElement1 = document.createElement( 'img' );
                    const imgElement_tag = document.createElement( 'p' );
                    imgElement1.onload = function() {
                        imgElement_tag.textContent = 'file: '+imgElement1.naturalWidth + 'px X ' + imgElement1.naturalHeight+'px / shown: '+imgElement1.width + 'px X ' + imgElement1.height+'px';
                    };
                    imgElement1.className = 'item-img';
                    imgElement1.src = file_names_ann[i]
                    //imgElement1.width = '200'
                    imgElement1.height = '200'
                    sceneElement2.appendChild(imgElement1)
                    sceneElement2.appendChild(imgElement_tag)


                    const sceneElement3 = document.createElement( 'div' );
                    sceneElement3.className = 'item';
                    element.appendChild( sceneElement3 );

                    const imgElement2 = document.createElement( 'img' );
                    imgElement2.className = 'item-img';
                    imgElement2.src = file_names_raw[i]

                        imgElement2_tag.textContent = 'file: '+imgElement2.naturalWidth + 'px X ' + imgElement2.naturalHeight+'px / shown: '+imgElement2.width + 'px X ' + imgElement2.height+'px';

                    imgElement2.height = '200'
                    sceneElement3.appendChild(imgElement2)
                    sceneElement3.appendChild(imgElement2_tag)


                    


                    const loader = new OBJLoader( );

                    async function asyncFunc1(obj) {
                        
                        const camera = new THREE.PerspectiveCamera( 50, aspect, 0.000001, 10 );
                                                //renderer.render( scene, camera );

                        //requestAnimationFrame( animate );
                        //render();                     
                        function render()
                        {
                            renderer.render( scene, camera );
                        }
                        
                        obj.traverse( function( o ) {
                            if ( o.isPoints )
                            {
                                scene.add( o );
                                
                                                                
                                // Get the position attribute
                                const posAttribute = o.geometry.getAttribute("position");

                                // Get the array inside the attribute
                                const posArray = posAttribute.array;
                                let min_y = 10
                                for (let i3 = 0; i3 < posArray.length; i3 += 3) {
                                // Example: Move each point along the x-axis
                                    if ( min_y > posArray[i3 + 1] )
                                    {
                                        min_y = posArray[i3 + 1] 
                                    }
                                }

                                // Iterate through the points and modify their positions
                                for (let i3 = 0; i3 < posArray.length; i3 += 3) {
                                // Example: Move each point along the x-axis
                                    posArray[i3 + 1] -= min_y; // Increment x-coordinate
                                }

                                // Tell the attribute it needs updating
                                posAttribute.needsUpdate = true;


                                //o.translateX(2);
                                objects.push( o );
                                //const controls_drag = new DragControls( [ o ], camera, renderer.domElement );
                                //controls_drag.setMode( 'rotate' )
                                console.log(o)
                                
                                const orbit = new OrbitControls(camera, renderer.domElement );
                                //orbit.minDistance = -2;
                                //orbit.maxDistance = 5;             
                                //orbit.rotateSpeed = -0.25       
                                //orbit.enablePan = false;
                                //controls.target.set(new THREE.Vector3(2,0,2))
                                //orbit.enableZoom = true;
                                
                                orbit.update();
                                orbit.addEventListener( 'change', render );

                                const control = new TransformControls( camera,  renderer.domElement );
                                control.addEventListener( 'change', render );
                                control.addEventListener( 'dragging-changed', function ( event ) {

                                    orbit.enabled = ! event.value;

                                } );

                                const position = camera.position.clone();
                                camera.position.copy( position );

                                orbit.object = camera;
                                control.camera = camera;

                                control.showX = true
                                control.showY = true
                                control.showZ = true
                                //camera.zoom = 3
                                // red x
                                // blue z
                                // green y
                                //if (i==0)                       

                                    
                                camera.position.x = 0.5
                                camera.position.y = 1.2
                                camera.position.z = 0.45

                                camera.rotation.x = -1.5
                                camera.rotation.y = 0
                                camera.rotation.z = 0

                                orbit.target.x = 0.5
                                orbit.target.y = 0
                                orbit.target.z = 0.45
                                    
                                    //Camera Position: 0.5741929772040216 0.8961178092152369 0.4321825287066512
                                    //Camera Rotation: -1.570795326918264 -1.5707317408547583e-8 -0.015707963362945058
                                    //obit target: 0.5741929943087092 -0.1928451952503207 0.4321814398779894

                                

                                camera.lookAt( orbit.target.x, orbit.target.y, orbit.target.z );
                                //camera.lookAt( 2,0,2 );
                                //console.log('-----------')
                                //console.log(position);
                                //console.log( orbit.target.x, orbit.target.y, orbit.target.z );

                                control.setSpace('local')
                                scene.add( new THREE.GridHelper( 2, 10, 0x888888, 0x444444 ) );
                                //const gizmo = control.getHelper();
                                //scene.add( gizmo );
                                control.setMode( 'rotate' );
                                control.attach(scene.userData.obj );                

                                render()
                            }
                        });
                        
                    }

                    let func_loaded = asyncFunc1;
                    func_arr.push(func_loaded)
                    // load a resource

                    loader.load(
                        // resource URL
                        file_names[i],
                        // called when resource is loaded
                        func_loaded,
                        // called when loading is in progress
                        function ( xhr ) {
                            //console.log( ( xhr.loaded / xhr.total * 100 ) + '% loaded' );
                        },
                        // called when loading has errors
                        function ( error ) {
                            console.error(error);

                        }
                    );

                    
                    //scene.add( new THREE.Mesh( geometry, material ) );

                    //scene.add( new THREE.HemisphereLight( 0xaaaaaa, 0x444444, 3 ) );


                    

                    //scenes.push( scene );
                    

                }

                //renderer.setAnimationLoop( animate );
                //animate()

            }
            


            
            function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();

                renderer.setSize( window.innerWidth, window.innerHeight );

            }
            function onClick( event ) {

                event.preventDefault();
                console.log(enableSelection);
                if ( enableSelection === true ) {

                    const draggableObjects = controls.objects;
                    draggableObjects.length = 0;
                    console.log(event.clientX);

                    mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
                    mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;


                    controls.transformGroup = false;
                    draggableObjects.push( ...objects );



                }

                render();

            }
